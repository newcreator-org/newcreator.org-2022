# 依存ライブラリの更新 PR（セキュリティ検査の方針: newcreator-org/docs/security-scanning-policy.md）
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      storybook:
        patterns: ["storybook", "@storybook/*"]
      next-react:
        patterns: ["next", "@next/*", "react", "react-dom", "@types/react", "@types/react-dom"]
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
